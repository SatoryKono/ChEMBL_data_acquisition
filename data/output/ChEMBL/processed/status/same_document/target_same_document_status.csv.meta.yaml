git_sha: unknown
command: get_input_initialisation.py --config config.yaml
config:
  api:
    chembl_base: https://www.ebi.ac.uk/chembl/api/data
    timeout_connect: 5
    timeout_read: 30
    retries: 3
    backoff_factor: 0.5
    rps: 5
    burst: 5
    user_agent: chembl-da/0.1 (mailto:info@example.org)
  openalex:
    base: https://api.openalex.org
    timeout_connect: 5
    timeout_read: 30
    retries: 3
    rps: 4
    burst: 5
    mailto: info@example.org
  crossref:
    base: https://api.crossref.org
    timeout_connect: 5
    timeout_read: 30
    retries: 3
    rps: 4
    burst: 5
    mailto: info@example.org
  uniprot:
    base: https://rest.uniprot.org
    timeout_connect: 5
    timeout_read: 30
    retries: 3
    rps: 4
    burst: 5
    delay: 0.25
  uniprot_mapping:
    base: https://rest.uniprot.org/idmapping
    poll_interval: 0.5
    timeout: 300.0
  iuphar:
    base: https://www.guidetopharmacology.org/services
    timeout_connect: 5
    timeout_read: 30
    retries: 3
    rps: 4
    burst: 5
  pubchem:
    base: https://pubchem.ncbi.nlm.nih.gov/rest/pug
    timeout_connect: 5
    timeout_read: 60
    retries: 3
    rps: 3
    burst: 5
    delay: 3.0
  pubmed:
    base: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
    timeout_connect: 5
    timeout_read: 10
    retries: 2
    encodings:
    - utf-8-sig
    - cp1251
    - latin1
  semantic_scholar:
    base: https://api.semanticscholar.org/graph/v1
    timeout_connect: 5
    timeout_read: 10
    retries: 2
    encodings:
    - utf-8-sig
  doc_type:
    weights:
      pubmed: 4
      openalex: 3
      scholar: 2
    thresholds:
      review: 1
      experimental: 1
      unknown: 2
  resources:
    dictionary_dir: dictionary
    iuphar_target_csv: dictionary\_IUPHAR\_IUPHAR_target.csv
    iuphar_family_csv: dictionary\_IUPHAR\_IUPHAR_family.csv
    uniprot_data_dir: dictionary\uniprot
    organism_csv: dictionary\_Target\organism.csv
  io:
    output_dir: data\output
    cache_dir: .cache
    csv_sep: ','
    csv_encoding: utf-8-sig
    csv_index: false
    exist_ok: true
  jobs:
    concurrency: 8
    chunk_size: 500
  batch:
    size: 1000
    pause: 0
    concurrency: 2
    fail_fast: true
    retry_failed: true
  quality:
    sample_rows: 0
    corr_method: pearson
    max_unique_preview: 50
    bin_count: 20
  mapper:
    enable_cache: true
    strict_schema: true
    warn_on_cast: true
  init:
    same_doc: data\input\ChEMBL\ChEMBL_same_document_20_05.xlsx
    all_doc: data\input\ChEMBL\ChEMBL_all_10_05_step5.xlsx
    output_dir: data\output\ChEMBL\processed
  rate:
    global_rps: 8
    global_burst: 8
  retry:
    max_attempts: 3
    backoff_factor: 0.5
    status_forcelist:
    - 429
    - 500
    - 502
    - 503
    - 504
  log:
    level: INFO
    format: '[%(asctime)s] %(levelname)s %(name)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
