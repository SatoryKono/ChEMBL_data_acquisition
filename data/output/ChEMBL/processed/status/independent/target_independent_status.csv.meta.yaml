git_sha: unknown
command: scripts\get_input_initialisation.py --config config.yaml
config:
  api:
    chembl_base: https://www.ebi.ac.uk/chembl/api/data
    timeout_connect: 5
    timeout_read: 30
    retries: 3
    backoff_factor: 0.5
    rps: 5
    burst: 5
    user_agent: your-app/1.0 (mailto:you@example.org)
  chembl:
    cache_ttl: 3600
    cache_maxsize: 1024
  openalex:
    base: https://api.openalex.org
    timeout_connect: 5
    timeout_read: 30
    retries: 3
    rps: 4
    burst: 5
    mailto: info@example.org
  crossref:
    base: https://api.crossref.org
    timeout_connect: 5
    timeout_read: 30
    retries: 3
    rps: 4
    burst: 5
    mailto: info@example.org
  uniprot:
    base: https://rest.uniprot.org
    timeout_connect: 5
    timeout_read: 30
    retries: 3
    rps: 4
    burst: 5
    delay: 0.25
  uniprot_mapping:
    base: https://rest.uniprot.org/idmapping
    poll_interval: 0.5
    timeout: 300.0
  iuphar:
    base: https://www.guidetopharmacology.org/services
    timeout_connect: 5
    timeout_read: 30
    retries: 3
    rps: 4
    burst: 5
  pubchem:
    base: https://pubchem.ncbi.nlm.nih.gov/rest/pug
    timeout_connect: 5
    timeout_read: 60
    retries: 3
    rps: 3
    burst: 5
    delay: 3.0
  pubmed:
    base: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
    timeout_connect: 5
    timeout_read: 10
    retries: 2
    encodings:
    - utf-8-sig
    - cp1251
    - latin1
  semantic_scholar:
    base: https://api.semanticscholar.org/graph/v1
    timeout_connect: 5
    timeout_read: 10
    retries: 2
    encodings:
    - utf-8-sig
  doc_type:
    weights:
      pubmed: 4
      openalex: 3
      scholar: 2
    thresholds:
      review: 1
      experimental: 1
      unknown: 2
  resources:
    dictionary_dir: dictionary
    iuphar_target_csv: dictionary\_IUPHAR\_IUPHAR_target.csv
    iuphar_family_csv: dictionary\_IUPHAR\_IUPHAR_family.csv
    uniprot_data_dir: dictionary\uniprot
    organism_csv: dictionary\_Target\organism.csv
    status_csv: dictionary\status.csv
    targets_type_csv: dictionary\targets_type.csv
  io:
    output_dir: data\output
    cache_dir: .cache
    csv_sep: ','
    csv_encoding: utf-8-sig
    csv_index: false
    exist_ok: true
  jobs:
    concurrency: 8
    chunk_size: 500
  log:
    level: INFO
    format: '[%(asctime)s] %(levelname)s %(name)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  init:
    same_doc: data\input\ChEMBL\ChEMBL_same_document_20_05.xlsx
    all_doc: data\input\ChEMBL\ChEMBL_all_10_05_step5.xlsx
    output_dir: data\output\ChEMBL\processed
  batch:
    size: 1000
    pause: 0.0
    concurrency: 2
    fail_fast: true
    retry_failed: true
  quality:
    sample_rows: 0
    corr_method: pearson
    max_unique_preview: 50
    bin_count: 20
  mapper:
    enable_cache: true
    strict_schema: true
    warn_on_cast: true
  rate:
    global_rps: 8
    global_burst: 8
    limiter_cache_maxsize: 128
    limiter_cache_ttl: 600
  retry:
    max_attempts: 3
    backoff_factor: 0.5
    status_forcelist:
    - 429
    - 500
    - 502
    - 503
    - 504
  activity:
    column: activity_chembl_id
    chunk_size: 5
    timeout: 30.0
    limit: null
    dry_run: false
  assay:
    column: assay_chembl_id
    chunk_size: 10
    timeout: 30.0
  testitem:
    column: molecule_chembl_id
    chunk_size: 5
    timeout: 30.0
  document:
    pubmed:
      column: PMID
      sleep: 5.0
      workers: 1
      batch_size: 100
    chembl:
      column: chembl_id
      chunk_size: 5
      timeout: 30.0
    all:
      column: chembl_id
      chunk_size: 5
      sleep: 5.0
      workers: 1
      batch_size: 50
      timeout: 30.0
  target:
    uniprot:
      column: uniprot_id
      data_dir: dictionary\uniprot
    chembl:
      column: chembl_id
      timeout: 30.0
    iuphar:
      target_csv: dictionary\_IUPHAR\_IUPHAR_target.csv
      family_csv: dictionary\_IUPHAR\_IUPHAR_family.csv
    all:
      data_dir: dictionary\uniprot
      target_csv: dictionary\_IUPHAR\_IUPHAR_target.csv
      family_csv: dictionary\_IUPHAR\_IUPHAR_family.csv
      timeout: 30.0
      organism_csv: dictionary\_Target\organism.csv
      uniprot_column: uniprot_id
      chembl_out: null
      uniprot_out: null
      iuphar_out: null
