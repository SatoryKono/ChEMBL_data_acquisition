# Default document post-processing pipeline configuration.
pipeline_version: "${CHEMBL_DOCUMENT_PIPELINE_VERSION:-auto}"
enabled_steps:
  - name: harmonize_document_titles
    callable: "library.postprocessing.documents.steps:harmonize_document_titles"
    description: "Backfill missing canonical titles from known source columns."
  - name: normalize_document_fields
    callable: "library.postprocessing.documents.steps:normalize_document_fields"
    description: "Normalize document metadata and harmonise citation fields."
    params:
      trim_whitespace: true
      normalise_unicode: true
  - name: derive_document_type
    callable: "library.postprocessing.documents.steps:derive_document_type"
    description: "Populate doc_type using publication_class and provider metadata."
  - name: enrich_document_publication_year
    callable: "library.postprocessing.documents.steps:enrich_document_publication_year"
    description: "Backfill publication year using DOI lookups and heuristics."
    params:
      fallback_year: 1900
      prefer_doi_year: true
  - name: finalize_document_records
    callable: "library.postprocessing.documents.steps:finalize_document_records"
    description: "Enforce schema ordering and deterministic identifier dtypes."
    params:
      enforce_schema: true
      ensure_unique_ids: true
params:
  defaults:
    pipeline_version: "${CHEMBL_DOCUMENT_PIPELINE_VERSION:-auto}"
    log_level: "${POSTPROCESS_LOG_LEVEL:-INFO}"
  io:
    encoding: "${POSTPROCESS_DEFAULT_ENCODING:-utf-8}"
    csv_sep: "${POSTPROCESS_DEFAULT_CSV_SEPARATOR:-,}"
  enrichment:
    doi_lookup_timeout: 5
    enable_fallback_crossref: false
