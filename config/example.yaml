# Example configuration overrides for local development.
# Copy this file to config/config.local.yaml and adjust values as needed.

sources:
  chembl:
    api:
      chembl_base: "https://www.ebi.ac.uk/chembl/api/data"
      user_agent: "chembl-da/1.0 (mailto:team@example.org)"
      rps: 10
      burst: 10
    cache:
      cache_ttl: 900
      cache_maxsize: 256
  pubchem:
    # PubChem enrichment is enabled by default. Keep this flag on unless you
    # explicitly need to skip augmentation (for example, when running in an
    # offline sandbox).
    enable: true
    # Example: tighten retry jitter locally when running against mocked APIs.
    retry_jitter_seconds: 0.1
    retry_jitter_seed: 7
  openalex:
    mailto: "team@example.org"
  crossref:
    mailto: "team@example.org"

local:
  io:
    # Final CSVs appear under this directory. Each export writes
    # `<name>.meta.yaml` with the pipeline version and row statistics alongside
    # optional `<name>.quality.json` reports.
    output_dir: "./data/output"
    cache_dir: "./data/cache"
  resources:
    dictionary_dir: "./config/dictionary"
    uniprot_data_dir: "./config/dictionary/_target/_uniprot"
    reference_smiles_csv: "./data/reference/Table6.csv"

system:
  log:
    level: "DEBUG"
  rate:
    global_rps: 20
    global_burst: 20
    limiter_cache_ttl: 600
    limiter_cache_maxsize: 64

# Run manifests (`reports/run_<timestamp>.json`) and the rolling
# `reports/run_manifest.json` alias live under the base path resolved by
# `--base-path`/`CHEMBL_DA_BASE_PATH`. They aggregate the per-step statistics and
# checksum metadata for downstream QA jobs.
