# Default configuration for ChEMBL data acquisition.
# Values can be overridden via CLI arguments or environment variables.
# Environment variables follow the ``CHEMBL_DA__SECTION__KEY`` pattern and
# many keys also provide short aliases such as ``CHEMBL_DA_RPS``.
# For the complete alias table see ``library/config/models.py``.
# Example:
#   export CHEMBL_DA__SOURCES__CHEMBL__API__CHEMBL_BASE=https://dev.example/chembl
#   export CHEMBL_DA_BASE=https://dev.example/chembl  # short alias

sources:
  chembl:
    api:
      # Base URL for ChEMBL API (env: CHEMBL_DA__SOURCES__CHEMBL__API__CHEMBL_BASE / CHEMBL_DA_BASE)
      chembl_base: "https://www.ebi.ac.uk/chembl/api/data"
      timeout_connect: 5  # Seconds to wait for a connection (env: CHEMBL_DA_TIMEOUT_CONNECT)
      timeout_read: 90  # Seconds to wait for a response (env: CHEMBL_DA_TIMEOUT_READ)
      retries: 3  # HTTP retry attempts
      backoff_factor: 0.5  # Exponential backoff multiplier
      rps: 20  # Requests per second limit (env: CHEMBL_DA_RPS)
      burst: 20  # Burst size for token bucket limiter (env: CHEMBL_DA_BURST)
      user_agent: "chembl-da/1.0 (mailto:chembl-data@ebi.ac.uk)"  # User-Agent header; override via CHEMBL_DA__SOURCES__CHEMBL__API__USER_AGENT
    cache:
      cache_ttl: 3600  # Seconds to cache ChEMBL API responses (env: CHEMBL_DA_CACHE_TTL)
      cache_maxsize: 1024  # Max cached ChEMBL responses (env: CHEMBL_DA_CACHE_MAXSIZE)
    molecule_catalog:
      cache_path: "$CHEMBL_DA_BASE_PATH/cache/molecule_parent_catalog.json"  # Local cache for molecule parents (env: CHEMBL_DA_MOLECULE_CATALOG_CACHE)
      sqlite_path: "$CHEMBL_DA_BASE_PATH/cache/molecule_parent_catalog.sqlite"  # SQLite cache for molecule parents (env: CHEMBL_DA_MOLECULE_CATALOG_SQLITE)
      endpoint: "molecule"  # API resource providing parent relationships
      child_field: "molecule_chembl_id"  # Column containing molecule identifiers
      parent_field: "parent_molecule_chembl_id"  # Column containing parent molecule identifiers
      hierarchy_lookup_path: "testitem_molecule_hierarchy"  # CSV with precomputed parent relationships
      hierarchy_lookup_encoding: "utf-8-sig"  # Encoding used for the hierarchy CSV
      hierarchy_lookup_delimiter: ","  # Delimiter used for the hierarchy CSV
      page_size: 500  # Page size for catalog fetching
    pipelines:
      activity:
        column: "activity_chembl_id"
        batch_size: 20
        workers: 1
        timeout: 90.0
        limit: null
        dry_run: false
      assay:
        column: "assay_chembl_id"
        batch_size: 25
        timeout: 60.0
        limit: null
      cellline:
        column: "cell_chembl_id"
        batch_size: 20
        timeout: 30.0
        limit: null
        offset: 0
      tissue:
        column: "tissue_chembl_id"
        batch_size: 20
        timeout: 30.0
        limit: null
        offset: 0
      testitem:
        column: "molecule_chembl_id"
        batch_size: 250
        timeout: 90.0
        limit: null
        offset: 0
        request_limit: 1000
        retries: 5
        backoff_factor: 0.5
        batch_retry:
          enable: true
          shrink_factor: 0.5
          min_size: 1
        fields:
          - molecule_chembl_id
          - parent_molecule_chembl_id
          - pref_name
          - max_phase
          - molecule_type
          - first_approval
          - oral
          - parenteral
          - topical
          - black_box_warning
          - structure_type
          - molecule_structures.canonical_smiles
          - molecule_structures.standard_inchi
          - molecule_structures.standard_inchi_key
          - pubchem_cid
          - pubchem_iupac_name
          - pubchem_molecular_formula
          - pubchem_isomeric_smiles
          - pubchem_canonical_smiles
          - pubchem_inchi
          - pubchem_inchikey
      document:
        pubmed:
          column: "PMID"
          sleep: 5.0
          workers: 1
          batch_size: 5
          limit: null
        chembl:
          column: "document_chembl_id"
          chunk_size: 20
          timeout: 90.0
          limit: null
        all:
          column: "document_chembl_id"
          chunk_size: 20
          sleep: 5.0
          workers: 1
          batch_size: 5
          timeout: 90.0
          limit: null
      target:
        uniprot:
          column: "uniprot_id"
          data_dir: "target_uniprot_cache"
          limit: null
        chembl:
          column: "target_chembl_id"  # Column containing ChEMBL target identifiers
          chunk_size: 3
          timeout: 90.0
          limit: null
          offset: 0
          batch_retry:
            enable: true
            shrink_factor: 0.5
            min_size: 1
        iuphar:
          target_csv: "target_iuphar_target"
          family_csv: "target_iuphar_family"
          limit: null
        all:
          column: "target_chembl_id"  # Column containing ChEMBL target identifiers
          data_dir: "target_uniprot_cache"
          target_csv: "target_iuphar_target"
          family_csv: "target_iuphar_family"
          chunk_size: 3
          timeout: 90.0
          uniprot_column: mapping_uniprot_id  # Column containing primary UniProt accession used for merges
          chembl_out: null
          uniprot_out: null
          iuphar_out: null
          limit: null
          offset: 0
  openalex:
    base: "https://api.openalex.org"  # OpenAlex API root URL (env: CHEMBL_DA_OPENALEX_BASE)
    timeout_connect: 5  # Connection timeout in seconds (env: CHEMBL_DA_OPENALEX_TIMEOUT_CONNECT)
    timeout_read: 30  # Read timeout in seconds (env: CHEMBL_DA_OPENALEX_TIMEOUT_READ)
    retries: 3  # Retry attempts
    rps: 5  # Requests per second limit (env: CHEMBL_DA_OPENALEX_RPS)
    burst: 5  # Burst size for rate limiter (env: CHEMBL_DA_OPENALEX_BURST)
    mailto: "chembl-data@ebi.ac.uk"  # Required contact email; replace with your team's address before production use (env: CHEMBL_DA_OPENALEX_MAILTO). Placeholder domains such as example.org are rejected.
  crossref:
    base: "https://api.crossref.org"  # CrossRef API root URL (env: CHEMBL_DA_CROSSREF_BASE)
    timeout_connect: 5  # (env: CHEMBL_DA_CROSSREF_TIMEOUT_CONNECT)
    timeout_read: 30  # (env: CHEMBL_DA_CROSSREF_TIMEOUT_READ)
    retries: 3
    rps: 5  # (env: CHEMBL_DA_CROSSREF_RPS)
    burst: 5  # (env: CHEMBL_DA_CROSSREF_BURST)
    mailto: "chembl-data@ebi.ac.uk"  # Required contact email; replace with your team's address before production use (env: CHEMBL_DA_CROSSREF_MAILTO). Placeholder domains such as example.org are rejected.
  uniprot:
    api:
      base: "https://rest.uniprot.org"  # UniProt REST API root (env: CHEMBL_DA_UNIPROT_BASE)
      timeout_connect: 5  # (env: CHEMBL_DA_UNIPROT_TIMEOUT_CONNECT)
      timeout_read: 30  # (env: CHEMBL_DA_UNIPROT_TIMEOUT_READ)
      rps: 25  # (env: CHEMBL_DA_UNIPROT_RPS)
      burst: 25  # (env: CHEMBL_DA_UNIPROT_BURST)
      delay: 0.25  # Delay between requests in seconds
    mapping:
      base: "https://rest.uniprot.org/idmapping"  # UniProt ID mapping API (env: CHEMBL_DA_UNIPROT_MAPPING_BASE)
      poll_interval: 0.5  # Seconds between polling attempts (env: CHEMBL_DA_UNIPROT_MAPPING_POLL_INTERVAL)
      timeout: 300.0  # Maximum time in seconds to wait for a mapping job (env: CHEMBL_DA_UNIPROT_MAPPING_TIMEOUT)
      cache_ttl: null  # TTL for cached mappings in seconds; null disables expiry (env: CHEMBL_DA_UNIPROT_MAPPING_CACHE_TTL)
  iuphar:
    base: "https://www.guidetopharmacology.org/services"  # IUPHAR API base (env: CHEMBL_DA__SOURCES__IUPHAR__BASE / CHEMBL_DA_IUPHAR_BASE)
    timeout_connect: 5  # (env: CHEMBL_DA_IUPHAR_TIMEOUT_CONNECT)
    timeout_read: 30  # (env: CHEMBL_DA_IUPHAR_TIMEOUT_READ)
    rps: 5  # (env: CHEMBL_DA_IUPHAR_RPS)
    burst: 5  # (env: CHEMBL_DA_IUPHAR_BURST)
  pubchem:
    enable: true  # Toggle PubChem augmentation (env: CHEMBL_DA_PUBCHEM_ENABLE)
    base: "https://pubchem.ncbi.nlm.nih.gov/rest/pug"  # PubChem PUG REST API (env: CHEMBL_DA__SOURCES__PUBCHEM__BASE / CHEMBL_DA_PUBCHEM_BASE)
    user_agent: "chembl-da/1.0 (mailto:chembl-data@ebi.ac.uk)"  # Contact details for PubChem requests (env: CHEMBL_DA_PUBCHEM_USER_AGENT)
    timeout_connect: 5  # (env: CHEMBL_DA_PUBCHEM_TIMEOUT_CONNECT)
    timeout_read: 60  # (env: CHEMBL_DA_PUBCHEM_TIMEOUT_READ)
    timeout_seconds: 30.0
    retries: 3
    rps: 5  # (env: CHEMBL_DA_PUBCHEM_RPS)
    burst: 5  # (env: CHEMBL_DA_PUBCHEM_BURST)
    delay: 0.2  # Delay between requests in seconds; must be a float for strict type validation
    backoff_initial_seconds: 0.5
    resolve_order:
      - cache
      - smiles
      - inchikey
      - inchi
      - pref_name
    cache_ttl: 3600  # Request cache time-to-live in seconds
    cache_maxsize: 1024  # Maximum cached PubChem responses
    cache_ttl_hours: null  # Persisted CID cache TTL in hours; null disables expiry
    cid_cache_path: "$CHEMBL_DA_BASE_PATH/cache/pubchem_cid_cache.json"
    batch_size: 50
    prefer_local_smiles: false
    prefer_local_values: true
    use_parent_for_salts: true
    allow_polymer: false
    write_not_found_literal: false

  pubmed:
    base: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"  # PubMed API root (env: CHEMBL_DA__SOURCES__PUBMED__BASE)
    timeout_connect: 5  # (env: CHEMBL_DA_PUBMED_TIMEOUT_CONNECT)
    timeout_read: 10  # (env: CHEMBL_DA_PUBMED_TIMEOUT_READ)
    retries: 2  # (env: CHEMBL_DA_PUBMED_RETRIES)
    rps: null  # Optional requests-per-second override for document acquisition
    burst: null  # Optional burst override for document acquisition
    tool: "chembl-da"  # (env: CHEMBL_DA_PUBMED_TOOL)
    email: "chembl-data@ebi.ac.uk"  # Contact email required by NCBI (env: CHEMBL_DA_PUBMED_EMAIL)
  semantic_scholar:
    base: "https://api.semanticscholar.org/graph/v1"  # Semantic Scholar API root (env: CHEMBL_DA__SOURCES__SEMANTIC_SCHOLAR__BASE)
    timeout_connect: 5  # (env: CHEMBL_DA_SEMANTIC_SCHOLAR_TIMEOUT_CONNECT)
    timeout_read: 10  # (env: CHEMBL_DA_SEMANTIC_SCHOLAR_TIMEOUT_READ)
    retries: 2  # (env: CHEMBL_DA_SEMANTIC_SCHOLAR_RETRIES)
    rps: null  # Optional requests-per-second override for document acquisition
    burst: null  # Optional burst override for document acquisition

local:
  resources:
    dictionary_dir: "dictionary_root"  # Directory with supplementary lookup tables
    iuphar_target_csv: "target_iuphar_target"  # IUPHAR target mapping file
    iuphar_family_csv: "target_iuphar_family"  # IUPHAR family mapping file
    uniprot_data_dir: "target_uniprot_cache"  # Directory containing cached UniProt JSON files
    targets_type_csv: "target_types"  # Target type mapping table
  io:
    output_dir: "$CHEMBL_DA_BASE_PATH/output"  # Directory for generated datasets
    cache_dir: "~/.cache/chembl-da"  # Directory for cached HTTP responses (env: CHEMBL_DA_CACHE_DIR)
    csv_sep: ","  # CSV field separator
    csv_encoding: "utf-8-sig"  # Encoding for CSV files
    csv_fallback_separators:
      - "\t"
      - ";"
    csv_chunksize: 10000  # Rows per batch when streaming deterministic CSV exports
    na_markers:
      - "#N/A"
    keep_na_markers: false  # Preserve identifiers matching NA markers instead of dropping them
    exist_ok: true  # Create directories with ensure_dirs if missing
    output_stamp_mode: "omit"  # Append --date token to defaults ('require') or keep deterministic names ('omit')
  init:
    same_doc: "$CHEMBL_DA_BASE_PATH/input/ChEMBL/ChEMBL_same_document_20_05.xlsx"  # Source workbook
    all_doc: "$CHEMBL_DA_BASE_PATH/input/ChEMBL/ChEMBL_all_10_05_step5.xlsx"
    output_dir: "$CHEMBL_DA_BASE_PATH/output/ChEMBL/processed"  # Output directory for processed files

activity_enrichment:
  action_type:
    enabled: true
    column: "action_type"
    log_missing: true
    log_distribution: true
    metrics:
      ic50: "inhibition"
      ec50: "activation"
      ac50: "activation"
      ki: "binding"
      kd: "binding"
    triages: {}
    functionality:
      agonist: "activation"
      partial agonist: "activation"
      antagonist: "inhibition"
      inhibitor: "inhibition"
      activator: "activation"
    mechanism: {}
    triage_fields:
      - "data_validity_description"
      - "data_validity_comment"
    functionality_fields:
      - "functional_activity"
      - "action_type"
    mechanism_fields:
      - "mechanism_of_action"
      - "mechanism_comment"
    allowlist:
      - "activation"
      - "inhibition"
      - "binding"
      - "pam"
      - "nam"
      - "triaged"
      - "unknown"
    positive_label: "PAM"
    negative_label: "NAM"
    fallback: "unknown"
  activity_properties:
    enabled: true
    column: "activity_properties"
    summary_column: "activity_property_summary"
    name_field: "type"
    value_field: "value"
    units_field: "units"
    separator: "; "
    pair_separator: "="
    drop_source_column: true
    log_missing: false
    log_distribution: false
    allowlist:
      - "measurement"
      - "assay"
      - "comments"
      - "effect_features"
      - "triage"
      - "mechanism"
      - "functionality"
    hash_column: "properties_hash"

testitem_molecule_enrichment:
  enable: true
  sources:
    molecule_catalog_path: "testitem_molecule_catalog"
    molecule_hierarchy_path: "testitem_molecule_hierarchy"
  output:
    salt_as_null_when_absent: true
  flags:
    coerce_to_bool: true
    parent_fallback: true
  logging:
    warn_missing_molecule: true
    warn_inconsistent_flags: true

activity_bounds:
  enable_from_relation: true      # Derive bounds from relation/value pairs when explicit bounds are absent
  enable_from_uncertainty: false  # Parse ± expressions when available
  rounding_digits: 3              # Decimal places for lower_value/upper_value
  clamp_nonnegative: true         # Clamp negative bounds for concentration-style metrics
  log_unknown_relations: true     # Emit warnings for unrecognised relation tokens

system:
  log:
    level: "INFO"  # Default logging level (env: CHEMBL_DA_LOG_LEVEL)
  rate:
    global_rps: 100  # Global requests-per-second limit
    global_burst: 100  # Global burst size
    limiter_cache_maxsize: 128  # Max cached limiters
    limiter_cache_ttl: 600  # Time-to-live for cached limiters in seconds
  retry:
    max_attempts: 4  # HTTP retry attempts (env: CHEMBL_DA_RETRY_MAX_ATTEMPTS)
    backoff_factor: 0.5  # Base delay multiplier (env: CHEMBL_DA_RETRY_BACKOFF_FACTOR)
    backoff_cap: null  # Maximum backoff delay in seconds (env: CHEMBL_DA_RETRY_BACKOFF_CAP)
    jitter_seed: 0  # Seed for deterministic retry jitter (env: CHEMBL_DA_RETRY_JITTER_SEED)
    status_forcelist:
      - 429  # Too Many Requests
      - 500
      - 502
      - 503
      - 504
  doc_quality:
    enable: true  # Toggle generation of table quality reports
    sample_rows: null  # Limit profiling to the first N rows (null keeps all)
    include_columns: null  # Optional allow list of column names to analyse
    exclude_columns: null  # Optional deny list of column names to skip
    fatal_on_error: false  # Fail the pipeline when table profiling raises
  doc_type:
    weights:
      pubmed: 4
      openalex: 3
      scholar: 2
    thresholds:
      review: 1
      experimental: 1
      unknown: 2
    limit: null
