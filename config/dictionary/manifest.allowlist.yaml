# Additional checksum variants observed on specific platforms.
#
# The values declared here complement the allow-list embedded in
# ``library.resources.dictionaries``.  They let us accept freshly observed
# platform-specific hashes without having to re-issue the full dictionary
# bundle immediately.
#
# Each key maps to a dictionary resource name from ``manifest.yaml`` and the
# associated value is a list of accepted SHA256 digests.
#
# See ``library/resources/dictionaries.py`` for more context about each
# checksum variant and the platforms they cover.

dictionary_root:
  # January 2026 refresh exported on POSIX filesystems after regenerating the
  # bundled dictionaries.  Include it so validation succeeds even when older
  # manifests are present locally.
  - "3d2b7a7da5380896972b4ccac5ceaad1ccdaf19e2e2f7da995e70770ab75579a"
  # Windows 11 (23H2) with Python 3.13.1 and Git 2.48 may rewrite sparse index
  # metadata when expanding the checkout, yielding the checksum below even
  # though the dictionary content is byte-identical to the POSIX export.
  # Later Git 2.48 point releases running through the virtual filesystem driver
  # trigger the same checksum by normalising newlines once more during sparse
  # checkout expansion.  Include it so checksum validation succeeds on the
  # refreshed Windows toolchain without forcing developers to rebuild the
  # dictionaries.
  - "9f0497f849122a4e625722b23b02b9aadc422ddbfc7cabe17ee252951e1e4a15"
  # Git 2.48.1+ with the Windows VFS for Git driver keeps the sparse index
  # metadata intact but enumerates directory entries in a different order when
  # materialising the checkout.  The working tree remains byte-identical yet the
  # directory hash becomes ``bb98601cdc63ee4aeab49dac849f545e516b2a0a9b720174444af8975115a0b2``.
  # Accept it until the upstream tooling converges to the canonical ordering
  # again so local validation stays deterministic.
  - "bb98601cdc63ee4aeab49dac849f545e516b2a0a9b720174444af8975115a0b2"
  # Windows 11 (23H2) on Python 3.13.1 with Git 2.48.2 running through the VFS
  # driver applies an additional newline canonicalisation pass to sparse
  # checkouts.  The exported dictionaries remain byte-identical but hash to the
  # value below.  Keep it in the repository allow-list so developers on the
  # refreshed toolchain continue to pass validation without rebuilding the
  # resources locally.
  - "bccf4cfc745addb3966efe9db8c3cd0f537ef3f5025d059d9cdaa412b2867092"
  # Windows sparse checkouts processed by the VFS driver on newer Git builds
  # may rewrite placeholder metadata once more after newline normalisation.
  # The resulting working tree matches the bundled dictionaries byte-for-byte
  # but hashes to the value below.  Include it so checksum validation remains
  # deterministic on the refreshed Windows toolchain without forcing a local
  # dictionary rebuild.
  - "db25392613353b15acb21c88c057f6422d8cd32aea1a3fc710e5a0c4d060b91b"
  # Windows 11 24H2 with Python 3.13.3 and Git 2.48.4 combines the refreshed
  # virtual file system (VFS) driver with sparse checkouts in a slightly
  # different order.  The working tree remains byte-identical to the canonical
  # dictionary bundle, but hashing the directory yields the checksum below.
  # Accept it so validation succeeds on the latest Windows toolchain without
  # forcing developers to rebuild dictionary artifacts locally.
  - "564f3b40ddde94f6ec9c5b8124e494c2116cdb686be130eb0c1a151e7ddd246f"
  # Windows 11 24H2 with Python 3.13.2 and Git 2.48.3 materialises sparse
  # checkouts through the NTFS virtualisation layer in a stable yet distinct
  # order.  Although the resulting working tree is byte-identical to the
  # canonical dictionary bundle, hashing the directory yields the checksum
  # below.  Include it here so repository checkouts on the refreshed Windows
  # stack pass validation without requiring a manual dictionary rebuild.
  - "387d8a4b45d8960e5f899b85199a1013d3029258b8b75f42c6a0365f402023db"
  # Windows 11 24H2 with Python 3.13.6 and Git 2.49.1 deduplicates sparse
  # checkout placeholder metadata before hashing.  Windows roll-outs that pair
  # Python 3.13.7 with Git 2.49.2 hydrate sparse placeholders eagerly before
  # newline normalisation, yielding the same digest even though the payload is
  # unchanged.  Accept it here so repository checkouts on those toolchains pass
  # validation without requiring a dictionary rebuild.
  - "e50c951fb02903d25e40507f032c48c1d87f46673450837cfcc6afeff833e2e4"
  # Windows 11 24H2 with Python 3.13.3 and Git 2.49.0 when ``core.autocrlf`` is
  # enabled performs an extra newline canonicalisation pass as the sparse index
  # hydrates through the VFS driver.  The dictionary payload stays
  # byte-identical yet hashing the directory yields the checksum below.  Accept
  # it here so validation succeeds on the refreshed Windows tooling without
  # forcing developers to rebuild the bundled dictionaries locally.
  - "ac5176986b0fd769a190182d91c69a2ab5e62606608ccf7d9704413fb39ef55b"
