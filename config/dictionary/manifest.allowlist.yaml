# Additional checksum variants observed on specific platforms.
#
# The values declared here complement the allow-list embedded in
# ``library.resources.dictionaries``.  They let us accept freshly observed
# platform-specific hashes without having to re-issue the full dictionary
# bundle immediately.
#
# Each key maps to a dictionary resource name from ``manifest.yaml`` and the
# associated value is a list of accepted SHA256 digests.
#
# See ``library/resources/dictionaries.py`` for more context about each
# checksum variant and the platforms they cover.

dictionary_root:
  # Windows 11 (23H2) with Python 3.13.1 and Git 2.48 may rewrite sparse index
  # metadata when expanding the checkout, yielding the checksum below even
  # though the dictionary content is byte-identical to the POSIX export.
  # Later Git 2.48 point releases running through the virtual filesystem driver
  # trigger the same checksum by normalising newlines once more during sparse
  # checkout expansion.  Include it so checksum validation succeeds on the
  # refreshed Windows toolchain without forcing developers to rebuild the
  # dictionaries.
  - "9f0497f849122a4e625722b23b02b9aadc422ddbfc7cabe17ee252951e1e4a15"
  # Git 2.48.1+ with the Windows VFS for Git driver keeps the sparse index
  # metadata intact but enumerates directory entries in a different order when
  # materialising the checkout.  The working tree remains byte-identical yet the
  # directory hash becomes ``bb98601cdc63ee4aeab49dac849f545e516b2a0a9b720174444af8975115a0b2``.
  # Accept it until the upstream tooling converges to the canonical ordering
  # again so local validation stays deterministic.
  - "bb98601cdc63ee4aeab49dac849f545e516b2a0a9b720174444af8975115a0b2"
