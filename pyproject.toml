[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "chembl-data-acquisition"
version = "0.1.3"
description = "Utilities for downloading and processing biological data from public APIs."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "ChEMBL Team"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "numpy==1.26.4 ; python_version < '3.13'",
  "numpy==2.1.3 ; python_version >= '3.13'",
  "pandas==2.1.4 ; python_version < '3.13'",
  "pandas==2.2.3 ; python_version >= '3.13'",
  "requests==2.32.3",
  "PyYAML==6.0.2",
  "openpyxl==3.1.5",
  "pyarrow==18.1.0 ; python_version < \"3.13\"",
  "jsonschema==4.23.0",
  "pandera==0.20.3",
  "cachetools==5.3.3",
  "pydantic==2.8.2",
]

[project.optional-dependencies]
dev = [
  "black==24.8.0",
  "build==1.3.0",
  "freezegun==1.5.5",
  "hypothesis==6.140.3",
  "mypy==1.18.2",
  "pandas-stubs==2.1.4.231227",
  "pre-commit==4.3.0",
  "psutil==7.1.0",
  "pytest==8.4.2",
  "pytest-json-report==1.5.0",
  "pytest-cov==7.0.0",
  "responses==0.25.8",
  "ruff==0.6.9",
  "twine==6.2.0",
  "types-cachetools==5.3.0.0",
  "types-jsonschema==4.23.0.20240712",
  "types-openpyxl==3.1.0.20240425",
  "types-PyYAML==6.0.12.20240311",
  "types-python-dateutil==2.9.0.20240316",
  "types-requests==2.31.0.20240406",
  "types-tabulate==0.9.0.20240106",
  "types-urllib3==1.26.25.6",
]

[project.scripts]
get-data = "library.cli.entrypoints:get_data_main"
get-activity-data = "library.cli.entrypoints:get_activity_data_main"
get-assay-data = "library.cli.entrypoints:get_assay_data_main"
get-target-data = "library.cli.entrypoints:get_target_data_main"
get-document-data = "library.cli.entrypoints:get_document_data_main"
get-document-type = "library.cli.entrypoints:get_document_type_main"
get-input-initialisation = "library.cli.entrypoints:get_input_initialisation_main"
get-testitem-data = "library.cli.entrypoints:get_testitem_data_main"
csv-utils = "library.cli.entrypoints:csv_utils_main"
mapper = "library.cli.entrypoints:mapper_main"
table-quality = "library.cli.entrypoints:table_quality_main"
chunk-io = "library.cli.entrypoints:chunk_io_main"
get-activities = "library.cli.entrypoints:get_activities_main"
check-determinism = "library.cli.entrypoints:check_determinism_main"
make-md-summary = "library.cli.entrypoints:make_md_summary_main"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = [
  "library",
  "library.*",
  "config",
  "config.schema",
  "config.dictionary",
  "config.dictionary.*",
  "scripts",
  "scripts.*",
  "tools",
]

[tool.setuptools.package-data]
"config" = [
  "config.yaml",
  "schema/document.yaml",
  "dictionary/_testitem/molecule_hierarchy.csv",
]
"config.schema" = ["document.yaml"]
"config.dictionary" = ["**/*"]
"library" = ["py.typed"]
"library.qa" = ["document_schema_crosswalk.yaml"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
files = ["library", "scripts", "config"]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = ["tests"]
plugins = ["pydantic.mypy"]
mypy_path = "typings"

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
