[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "chembl-data-acquisition"
version = "0.1.0"
description = "Utilities for downloading and processing biological data from public APIs."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "ChEMBL Team"}
]
dependencies = [
  "numpy==2.3.3",
  "pandas==2.3.2",
  "requests==2.32.5",
  "PyYAML==6.0.2",
  "openpyxl==3.1.5",
  "pyarrow==17.0.0",
  "jsonschema==4.25.1",
  "pandera==0.26.1",
  "cachetools==5.3.2",
  "pydantic==2.11.3",
]

[project.optional-dependencies]
dev = [
  "black==25.1.0",
  "hypothesis==6.138.15",
  "mypy==1.17.1",
  "pandas-stubs==2.3.2.250827",
  "pre-commit==4.3.0",
  "psutil==7.0.0",
  "pytest==8.4.2",
  "pytest-cov==6.0.0",
  "responses==0.25.8",
  "ruff==0.13.0",
  "types-cachetools==6.2.0.20250827",
  "types-jsonschema==4.25.1.20250822",
  "types-openpyxl==3.1.5.20250821",
  "types-PyYAML==6.0.12.20250822",
  "types-python-dateutil",
  "types-requests==2.32.4.20250809",
  "types-tabulate",
  "types-urllib3==1.26.25.14",
]

[project.scripts]
get-activity-data = "library.cli.commands.get_activity_data:main"
get-assay-data = "library.cli.commands.get_assay_data:main"
get-target-data = "library.cli.commands.get_target_data:main"
get-document-data = "library.cli.commands.get_document_data:main"
get-document-type = "library.utils.cli_tools.get_document_type:main"
get-input-initialisation = "library.utils.cli_tools.get_input_initialisation:main"
get-testitem-data = "library.cli.commands.get_testitem_data:main"
csv-utils = "library.utils.cli_tools.csv_utils_main:main"
mapper = "library.utils.cli_tools.mapper_main:main"
table-quality = "library.utils.cli_tools.table_quality_main:main"
chunk-io = "library.utils.cli_tools.chunk_io_main:main"
get-activities = "library.utils.cli_tools.get_activities:main"
check-determinism = "library.utils.cli_tools.check_determinism:main"

[tool.setuptools]
py-modules = [
  "scripts.check_determinism",
  "scripts.chunk_io",
  "scripts.chunk_io_main",
  "scripts.csv_utils",
  "scripts.csv_utils_main",
  "scripts.dtype_inspector",
  "scripts.dtype_inspector_main",
  "scripts.get_activities",
  "scripts.get_activity_data",
  "scripts.get_assay_data",
  "scripts.get_document_data",
  "scripts.get_document_type",
  "scripts.get_input_initialisation",
  "scripts.get_target_data",
  "scripts.get_testitem_data",
  "scripts.mapper",
  "scripts.mapper_batch_main",
  "scripts.mapper_main",
  "scripts.table_quality",
  "scripts.table_quality_main",
]

[tool.setuptools.packages.find]
include = ["library", "schemas"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
files = ["library"]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "pandas",
  "pandas.*",
  "requests",
  "requests.*",
  "yaml",
  "yaml.*",
  "cachetools",
  "cachetools.*",
  "tabulate",
  "tabulate.*",
  "openpyxl",
  "openpyxl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
