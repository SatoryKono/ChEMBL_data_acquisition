[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chembl-data-acquisition"
version = "0.1.0"
description = "Utilities for downloading and processing biological data from public APIs."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "ChEMBL Team"}
]
dependencies = [
  "numpy>=2.3.3",
  "pandas>=2.3.2",
  "requests>=2.32.5",
  "PyYAML>=6.0.2",
  "openpyxl>=3.1.5",
  "pyarrow>=21.0.0",
  "jsonschema>=4.25.1",
  "pandera>=0.26.1",
  "cachetools>=5.3.2",
  "pydantic>=2.10.7",
]

[project.optional-dependencies]
dev = [
  "black==25.1.0",
  "ruff==0.13.0",
  "mypy==1.17.1",
  "pre-commit==4.3.0",
  "pandas-stubs==2.3.2.250827",
  "types-requests==2.32.4.20250809",
  "types-python-dateutil",
  "types-PyYAML==6.0.12.20250822",
  "types-jsonschema==4.25.1.20250822",
  "pytest==8.4.2",
  "types-openpyxl>=3.1.5",
  "hypothesis>=6",
  "responses>=0.25",
  "types-cachetools==6.2.0.20250827",
  "types-urllib3==1.26.25.14",
  "types-tabulate",
  "psutil>=5",
]

[project.scripts]
get-activity-data = "scripts.get_activity_data:main"
get-assay-data = "scripts.get_assay_data:main"
get-target-data = "scripts.get_target_data:main"
get-document-data = "scripts.get_document_data:main"
get-document-type = "scripts.get_document_type:main"
get-input-initialisation = "scripts.get_input_initialisation:main"
get-testitem-data = "scripts.get_testitem_data:main"
csv-utils = "scripts.csv_utils_main:main"
mapper = "scripts.mapper_main:main"
table-quality = "scripts.table_quality_main:main"
chunk-io = "scripts.chunk_io_main:main"

[tool.setuptools]
py-modules = [
  "scripts.get_activity_data",
  "scripts.get_assay_data",
  "scripts.get_target_data",
  "scripts.get_document_data",
  "scripts.get_document_type",
  "scripts.get_input_initialisation",
  "scripts.get_testitem_data",
  "scripts.csv_utils_main",
  "scripts.mapper_main",
  "scripts.table_quality_main",
  "scripts.chunk_io_main",
]

[tool.setuptools.packages.find]
include = ["library", "schemas"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = "^(?!library/).*"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
