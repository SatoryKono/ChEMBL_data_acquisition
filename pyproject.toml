[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "chembl-data-acquisition"
version = "0.1.3"
description = "Utilities for downloading and processing biological data from public APIs."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "ChEMBL Team"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "numpy==2.2.3",
  "pandas==2.2.3",
  "requests==2.32.3",
  "PyYAML==6.0.2",
  "openpyxl==3.1.5",
  "pyarrow==18.1.0",
  "jsonschema==4.23.0",
  "pandera==0.20.3",
  "cachetools==5.3.3",
  "pydantic==2.8.2",
]

[project.optional-dependencies]
dev = [
  "black==24.10.0",
  "build==1.2.2.post1",
  "hypothesis==6.140.1",
  "mypy==1.10.0",
  "pandas-stubs==2.2.3.250308",
  "pre-commit==3.7.1",
  "psutil==5.9.8",
  "pytest==8.3.3",
  "pytest-json-report==1.5.0",
  "pytest-cov==5.0.0",
  "responses==0.25.3",
  "ruff==0.7.2",
  "twine==5.0.0",
  "types-cachetools==5.4.0.20240717",
  "types-jsonschema==4.23.0.20240712",
  "types-openpyxl==3.1.5.20250506",
  "types-PyYAML==6.0.12.20241221",
  "types-python-dateutil==2.9.0.20241003",
  "types-requests==2.32.0.20250306",
  "types-tabulate==0.9.0.20240106",
  "types-urllib3==1.26.25.14",
]

[project.scripts]
get-data = "library.cli.entrypoints:get_data_main"
get-activity-data = "library.cli.entrypoints:get_activity_data_main"
get-assay-data = "library.cli.entrypoints:get_assay_data_main"
get-target-data = "library.cli.entrypoints:get_target_data_main"
get-document-data = "library.cli.entrypoints:get_document_data_main"
get-document-type = "library.cli.entrypoints:get_document_type_main"
get-input-initialisation = "library.cli.entrypoints:get_input_initialisation_main"
get-testitem-data = "library.cli.entrypoints:get_testitem_data_main"
csv-utils = "library.cli.entrypoints:csv_utils_main"
mapper = "library.cli.entrypoints:mapper_main"
table-quality = "library.cli.entrypoints:table_quality_main"
chunk-io = "library.cli.entrypoints:chunk_io_main"
get-activities = "library.cli.entrypoints:get_activities_main"
check-determinism = "library.cli.entrypoints:check_determinism_main"
make-md-summary = "library.cli.entrypoints:make_md_summary_main"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = [
  "library",
  "library.*",
  "config",
  "config.dictionary",
  "config.dictionary.*",
  "scripts", 
  "scripts.*", 
  "tools",
]

[tool.setuptools.package-data]
"config" = [
  "config.yaml",
  "dictionary/_testitem/molecule_hierarchy.csv",
]
"config.dictionary" = ["**/*"]
"library" = ["py.typed"]
"library.qa" = ["document_schema_crosswalk.yaml"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
files = ["library", "scripts"]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = ["tests"]
plugins = ["pydantic.mypy"]
mypy_path = "typings"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
