[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chembl-data-acquisition"
version = "0.1.0"
description = "Utilities for downloading and processing biological data from public APIs."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ChEMBL" }]
dependencies = [
    "numpy==2.3.3",
    "pandas==2.3.2",
    "requests==2.32.5",
    "PyYAML==6.0.2",
    "openpyxl==3.1.5",
    "pyarrow==21.0.0",
    "jsonschema==4.25.1",
    "pandera==0.26.1",
    "cachetools==5.3.2",
]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "ruff==0.13.0",
    "mypy==1.17.1",
    "pre-commit==4.3.0",
    "pandas-stubs==2.3.2.250827",
    "types-requests==2.32.4.20250809",
    "types-PyYAML==6.0.12.20250822",
    "types-jsonschema==4.25.1.20250822",
    "types-openpyxl>=3.1.5",
    "pytest==8.4.2",
    "hypothesis==6.138.15",
    "responses==0.25.8"
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_cli_bad_config.py"
testpaths = ["tests"]
