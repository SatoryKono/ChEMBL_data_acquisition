# This file configures pre-commit hooks for formatting, linting and type checking.
# Install the hooks with `pre-commit install` and run them with `pre-commit run --all-files`.

default_language_version:
  python: python

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: []
        pass_filenames: false
        additional_dependencies:
          - pandas-stubs==2.2.3.250527
          - types-requests==2.32.4.20250913
          - types-PyYAML==6.0.12.20250915
          - types-jsonschema==4.23.0.20250516
          - types-python-dateutil==2.9.0.20251008
          - types-openpyxl==3.1.5.20250919
          - types-cachetools==5.5.0.20240820
          - types-urllib3==1.26.25.14
          - types-tabulate==0.9.0.20241207
          - pytest==8.4.2
          - pydantic==2.8.2
          - pandera==0.20.3
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: python
        additional_dependencies: [".[dev]"]
        pass_filenames: false
        types: [python]
