# This file configures pre-commit hooks for formatting, linting and type checking.
# Install the hooks with `pre-commit install` and run them with `pre-commit run --all-files`.

default_language_version:
  python: python

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        args: []
        pass_filenames: false
        additional_dependencies:
          - pandas-stubs==2.2.3.241126
          - types-requests==2.32.0.20241016
          - types-PyYAML==6.0.12.20240808
          - types-jsonschema==4.23.0.20240813
          - types-python-dateutil==2.9.0.20241003
          - types-openpyxl==3.1.5.20240822
          - types-cachetools==5.5.0.20240820
          - types-urllib3==1.26.25.14
          - types-tabulate==0.9.0.20241207
          - pytest==8.4.2
          - pydantic==2.11.9
          - pandera==0.26.1
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: python
        additional_dependencies: [".[dev]"]
        pass_filenames: false
        types: [python]
