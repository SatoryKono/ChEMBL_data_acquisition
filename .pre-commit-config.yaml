repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pandas
          - pandas-stubs
          - requests
          - types-requests
          - PyYAML
          - types-PyYAML
          - jsonschema
          - types-jsonschema
          - pandera
  - repo: local
    hooks:
      - id: check-determinism
        name: check deterministic CSV output
        entry: python scripts/check_determinism.py
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        args: ["--ignore=tests/test_cli_bad_config.py"]
