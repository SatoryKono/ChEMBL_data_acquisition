[pytest]
addopts = -q --disable-warnings --maxfail=1 --durations=10
markers =
    unit: fast unit-level tests focusing on individual functions
    integration: tests covering multiple modules working together
    e2e: end-to-end scenarios exercising the test item pipeline
    slow: tests that exceed the default runtime budgets and are skipped by default locally
    network: tests that require live network connectivity (disabled in CI)
