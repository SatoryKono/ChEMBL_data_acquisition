name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  install-py313:
    name: Python 3.13 install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project without optional pyarrow
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Assert optional parquet fallback
        run: |
          python - <<'PY'
          import importlib.util
          import io
          from library.common.pandas_utils import read_csv_pyarrow

          assert importlib.util.find_spec("pyarrow") is None, "pyarrow should be optional on Python 3.13"

          frame = read_csv_pyarrow(io.StringIO("a,b\n1,2\n"))
          assert list(frame.columns) == ["a", "b"], frame
          PY

  make-smoke:
    name: Makefile smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure init and lint targets succeed
        run: |
          make init
          make lint

  quality-and-tests:
    name: Quality gates and test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install -r requirements-dev.txt -c requirements-lock.txt
      - name: Check installed packages
        run: pip check
      - name: Ruff check
        run: ruff check .
      - name: Black check
        run: black --check .
      - name: Ruff docstring coverage
        run: >-
          ruff check
          --select D100,D101,D102,D103
          scripts/get_activity_data.py
          scripts/get_assay_data.py
          scripts/get_document_data.py
          scripts/get_target_data.py
          scripts/get_testitem_data.py
          library/io/paths.py
      - name: Type check
        id: type-check
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p reports
          mypy --strict library | tee reports/mypy-report.txt
      - name: Run pytest suite
        id: run-tests
        continue-on-error: true
        run: python scripts/run_tests.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/mypy-report.txt
            reports/test_report.json
            reports/test_summary.md
            reports/coverage
          if-no-files-found: warn
      - name: Publish test summary to job summary
        if: always()
        run: |
          if [ -f reports/test_summary.md ]; then
            cat reports/test_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Test Summary";
              echo "reports/test_summary.md was not generated";
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check test success rate
        id: check-success-rate
        if: always()
        continue-on-error: true
        run: python -m scripts.check_test_success_rate --report reports/test_report.json --threshold 95
      - name: Check coverage threshold
        id: check-coverage
        if: always()
        continue-on-error: true
        run: python -m scripts.check_coverage_threshold --report reports/coverage/coverage.xml --threshold 80
      - name: Enforce test quality gates
        if: always()
        run: |
          if [ "${{ steps.type-check.outcome }}" != "success" ]; then
            echo "mypy failed; see reports/mypy-report.txt in the test-reports artifact" >&2
            exit 1
          fi
          if [ "${{ steps.run-tests.outcome }}" != "success" ]; then
            echo "pytest execution failed; see previous logs for details" >&2
            exit 1
          fi
          if [ "${{ steps.check-success-rate.outcome }}" != "success" ]; then
            echo "Test success rate check failed" >&2
            exit 1
          fi
          if [ "${{ steps.check-coverage.outcome }}" != "success" ]; then
            echo "Coverage threshold check failed" >&2
            exit 1
          fi
      - name: Determinism smoke test
        run: >-
          python scripts/check_determinism.py
          --limit 5
          --offline
          --fixtures-dir tests/resources/expected_get_data
      - name: Deterministic CSV writers
        run: python -m library.utils.cli_tools.check_determinism --log-level INFO
      - name: Smoke test get_data orchestrator
        run: pytest -k "get_data_main_smoke"
      - name: Smoke CLI entry points
        run: |
          set -euxo pipefail
          python -m scripts.get_data --help
          tmp_output="$(mktemp -d)"
          python -m library.utils.cli_tools.pipeline_targets_main \
            --input tests/data/chembl_targets_min.csv \
            --final-out "${tmp_output}/targets.csv" \
            --log-level INFO \
            --limit 2
          python scripts/get_activities.py --limit 5 --final-out "${tmp_output}/activities.csv"
          test -f "${tmp_output}/activities.csv"
          test -f "${tmp_output}/activities.csv.meta.yaml"
          if compgen -G "${tmp_output}/.activities.csv.*.tmp" > /dev/null; then
            echo "Temporary files from get_activities smoke test were not cleaned up" >&2
            exit 1
          fi
      - name: Upload output data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-output
          path: data/output
          if-no-files-found: ignore
