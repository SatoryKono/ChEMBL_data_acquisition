name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          # Install package along with development extras
          pip install .[dev]
      - name: Check installed packages
        run: pip check
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Docstring coverage
        run: >-
          ruff check
          --select D100,D101,D102,D103
          scripts/get_activity_data.py
          scripts/get_assay_data.py
          scripts/get_document_data.py
          scripts/get_target_data.py
          scripts/get_testitem_data.py
          library/io/paths.py
      - name: Type check
        run: mypy --strict library
      - name: Run tests
        run: pytest
      - name: Smoke test get_data orchestrator
        run: pytest -k "get_data_main_smoke"
      - name: Smoke CLI entry points
        run: |
          set -euxo pipefail
          python -m scripts.get_data --help
          tmp_output="$(mktemp -d)"
          python -m library.utils.cli_tools.pipeline_targets_main \
            --input tests/data/chembl_targets_min.csv \
            --output "${tmp_output}/targets.csv" \
            --log-level INFO \
            --limit 2
      - name: Upload output data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-output
          path: data/output
          if-no-files-found: ignore
