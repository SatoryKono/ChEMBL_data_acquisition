name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          # Install the project using the canonical lock file
          pip install -r requirements-lock.txt
      - name: Check installed packages
        run: pip check
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Docstring coverage
        run: >-
          ruff check
          --select D100,D101,D102,D103
          scripts/get_activity_data.py
          scripts/get_assay_data.py
          scripts/get_document_data.py
          scripts/get_target_data.py
          scripts/get_testitem_data.py
          library/io/paths.py
      - name: Type check
        run: mypy --strict library
      - name: Run tests
        id: run-tests
        continue-on-error: true
        run: python -m scripts.run_tests
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            reports/test_report.json
            reports/test_summary.md
            reports/coverage
          if-no-files-found: warn
      - name: Publish test summary to job summary
        if: always()
        run: |
          if [ -f reports/test_summary.md ]; then
            cat reports/test_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Test Summary";
              echo "reports/test_summary.md was not generated";
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check test success rate
        id: check-success-rate
        if: always()
        continue-on-error: true
        run: python -m scripts.check_test_success_rate --report reports/test_report.json --threshold 95
      - name: Enforce test quality gates
        if: always()
        run: |
          if [ "${{ steps.run-tests.outcome }}" != "success" ]; then
            echo "pytest execution failed; see previous logs for details" >&2
            exit 1
          fi
          if [ "${{ steps.check-success-rate.outcome }}" != "success" ]; then
            echo "Test success rate check failed" >&2
            exit 1
          fi
      - name: Determinism smoke test
        run: python scripts/check_determinism.py --limit 5
      - name: Smoke test get_data orchestrator
        run: pytest -k "get_data_main_smoke"
      - name: Smoke CLI entry points
        run: |
          set -euxo pipefail
          python -m scripts.get_data --help
          tmp_output="$(mktemp -d)"
          python -m library.utils.cli_tools.pipeline_targets_main \
            --input tests/data/chembl_targets_min.csv \
            --final-out "${tmp_output}/targets.csv" \
            --log-level INFO \
            --limit 2
          python scripts/get_activities.py --limit 5 --dry-run
      - name: Upload output data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-output
          path: data/output
          if-no-files-found: ignore
