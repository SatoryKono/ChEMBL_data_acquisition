name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          # Install package along with development extras
          pip install .[dev]
      - name: Check formatting
        run: ruff format --check .
      - name: Verify deterministic CSV output
        run: python scripts/check_determinism.py --log-level DEBUG
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Type check
        run: mypy --strict library
      - name: Smoke test cache
        run: pytest -q tests/test_chembl_client.py::test_request_json_cache
      - name: Upload output data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-output
          path: data/output
          if-no-files-found: ignore
