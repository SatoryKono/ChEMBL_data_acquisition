name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          # Install package along with development extras
          pip install .[dev]
      - name: Check installed packages
        run: pip check
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --strict library
      - name: Run tests
        run: pytest
      - name: Smoke test get_data orchestrator
        run: pytest -k "get_data_main_smoke"
      - name: Verify deterministic CSV output
        run: python scripts/check_determinism.py --log-level DEBUG
      - name: Upload output data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-output
          path: data/output
          if-no-files-found: ignore
