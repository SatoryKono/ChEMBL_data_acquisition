# Default configuration for ChEMBL data acquisition.
# Values can be overridden via CLI arguments or environment variables.
# Environment variables follow the ``CHEMBL_DA__SECTION__KEY`` pattern and
# many keys also provide short aliases such as ``CHEMBL_DA_RPS``.
# For the complete alias table see ``library/config.py``.
# Example:
#   export CHEMBL_DA__SOURCES__CHEMBL__API__CHEMBL_BASE=https://dev.example/chembl
#   export CHEMBL_DA_BASE=https://dev.example/chembl  # short alias

sources:
  chembl:
    api:
      # Base URL for ChEMBL API (env: CHEMBL_DA__SOURCES__CHEMBL__API__CHEMBL_BASE / CHEMBL_DA_BASE)
      chembl_base: "https://www.ebi.ac.uk/chembl/api/data"
      timeout_connect: 5  # Seconds to wait for a connection (env: CHEMBL_DA_TIMEOUT_CONNECT)
      timeout_read: 30  # Seconds to wait for a response (env: CHEMBL_DA_TIMEOUT_READ)
      retries: 3  # HTTP retry attempts
      backoff_factor: 0.5  # Exponential backoff multiplier
      rps: 20  # Requests per second limit (env: CHEMBL_DA_RPS)
      burst: 20  # Burst size for token bucket limiter (env: CHEMBL_DA_BURST)
      user_agent: "chembl-da/0.1 (mailto:contact@example.org)"  # User-Agent header; override via CHEMBL_DA__SOURCES__CHEMBL__API__USER_AGENT
    cache:
      cache_ttl: 3600  # Seconds to cache ChEMBL API responses (env: CHEMBL_DA_CACHE_TTL)
      cache_maxsize: 1024  # Max cached ChEMBL responses (env: CHEMBL_DA_CACHE_MAXSIZE)
    molecule_catalog:
      cache_path: "data/cache/molecule_parent_catalog.json"  # Local cache for molecule parents (env: CHEMBL_DA_MOLECULE_CATALOG_CACHE)
      endpoint: "molecule"  # API resource providing parent relationships
      child_field: "molecule_chembl_id"  # Column containing molecule identifiers
      parent_field: "parent_molecule_chembl_id"  # Column containing parent molecule identifiers
      page_size: 500  # Page size for catalog fetching
    pipelines:
      activity:
        column: "activity_chembl_id"
        batch_size: 50
        timeout: 30.0
        limit: null
        dry_run: false
      assay:
        column: "assay_chembl_id"
        batch_size: 50
        timeout: 30.0
        limit: null
      testitem:
        column: "molecule_chembl_id"
        batch_size: 50
        timeout: 30.0
        limit: null
      document:
        pubmed:
          column: "PMID"
          sleep: 5.0
          workers: 1
          batch_size: 5
          limit: null
        chembl:
          column: "document_chembl_id"
          chunk_size: 50
          timeout: 30.0
          limit: null
        all:
          column: "document_chembl_id"
          chunk_size: 5
          sleep: 5.0
          workers: 1
          batch_size: 5
          timeout: 30.0
          limit: null
      target:
        uniprot:
          column: "uniprot_id"
          data_dir: "dictionary/uniprot"
          limit: null
        chembl:
          column: "target_chembl_id"  # Column containing ChEMBL target identifiers
          chunk_size: 5
          timeout: 30.0
          limit: null
        iuphar:
          target_csv: "dictionary/_IUPHAR/_IUPHAR_target.csv"
          family_csv: "dictionary/_IUPHAR/_IUPHAR_family.csv"
          limit: null
        all:
          data_dir: "dictionary/uniprot"
          target_csv: "dictionary/_IUPHAR/_IUPHAR_target.csv"
          family_csv: "dictionary/_IUPHAR/_IUPHAR_family.csv"
          chunk_size: 5
          timeout: 30.0
          organism_csv: "dictionary/_Target/targets_type.csv"
          uniprot_column: "uniprot_id"
          chembl_out: null
          uniprot_out: null
          iuphar_out: null
          limit: null
  openalex:
    base: "https://api.openalex.org"  # OpenAlex API root URL (env: CHEMBL_DA_OPENALEX_BASE)
    timeout_connect: 5  # Connection timeout in seconds (env: CHEMBL_DA_OPENALEX_TIMEOUT_CONNECT)
    timeout_read: 30  # Read timeout in seconds (env: CHEMBL_DA_OPENALEX_TIMEOUT_READ)
    retries: 3  # Retry attempts
    rps: 5  # Requests per second limit (env: CHEMBL_DA_OPENALEX_RPS)
    burst: 5  # Burst size for rate limiter (env: CHEMBL_DA_OPENALEX_BURST)
    mailto: "contact@example.org"  # Required contact email (env: CHEMBL_DA_OPENALEX_MAILTO)
  crossref:
    base: "https://api.crossref.org"  # CrossRef API root URL (env: CHEMBL_DA_CROSSREF_BASE)
    timeout_connect: 5  # (env: CHEMBL_DA_CROSSREF_TIMEOUT_CONNECT)
    timeout_read: 30  # (env: CHEMBL_DA_CROSSREF_TIMEOUT_READ)
    retries: 3
    rps: 5  # (env: CHEMBL_DA_CROSSREF_RPS)
    burst: 5  # (env: CHEMBL_DA_CROSSREF_BURST)
    mailto: "contact@example.org"  # Required contact email (env: CHEMBL_DA_CROSSREF_MAILTO)
  uniprot:
    api:
      base: "https://rest.uniprot.org"  # UniProt REST API root (env: CHEMBL_DA_UNIPROT_BASE)
      timeout_connect: 5  # (env: CHEMBL_DA_UNIPROT_TIMEOUT_CONNECT)
      timeout_read: 30  # (env: CHEMBL_DA_UNIPROT_TIMEOUT_READ)
      rps: 25  # (env: CHEMBL_DA_UNIPROT_RPS)
      burst: 25  # (env: CHEMBL_DA_UNIPROT_BURST)
      delay: 0.25  # Delay between requests in seconds
    mapping:
      base: "https://rest.uniprot.org/idmapping"  # UniProt ID mapping API (env: CHEMBL_DA_UNIPROT_MAPPING_BASE)
      poll_interval: 0.5  # Seconds between polling attempts (env: CHEMBL_DA_UNIPROT_MAPPING_POLL_INTERVAL)
      timeout: 300.0  # Maximum time in seconds to wait for a mapping job (env: CHEMBL_DA_UNIPROT_MAPPING_TIMEOUT)
      cache_ttl: null  # TTL for cached mappings in seconds; null disables expiry (env: CHEMBL_DA_UNIPROT_MAPPING_CACHE_TTL)
  iuphar:
    base: "https://www.guidetopharmacology.org/services"  # IUPHAR API base (env: CHEMBL_DA__SOURCES__IUPHAR__BASE / CHEMBL_DA_IUPHAR_BASE)
    timeout_connect: 5  # (env: CHEMBL_DA_IUPHAR_TIMEOUT_CONNECT)
    timeout_read: 30  # (env: CHEMBL_DA_IUPHAR_TIMEOUT_READ)
    rps: 5  # (env: CHEMBL_DA_IUPHAR_RPS)
    burst: 5  # (env: CHEMBL_DA_IUPHAR_BURST)
  pubchem:
    base: "https://pubchem.ncbi.nlm.nih.gov/rest/pug"  # PubChem PUG REST API (env: CHEMBL_DA__SOURCES__PUBCHEM__BASE / CHEMBL_DA_PUBCHEM_BASE)
    timeout_connect: 5  # (env: CHEMBL_DA_PUBCHEM_TIMEOUT_CONNECT)
    timeout_read: 60  # (env: CHEMBL_DA_PUBCHEM_TIMEOUT_READ)
    retries: 3
    rps: 5  # (env: CHEMBL_DA_PUBCHEM_RPS)
    burst: 5  # (env: CHEMBL_DA_PUBCHEM_BURST)
    delay: 0.2  # Delay between requests in seconds; must be a float for strict type validation
    cache_ttl: 3600  # Request cache time-to-live in seconds
  pubmed:
    base: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"  # PubMed API root (env: CHEMBL_DA__SOURCES__PUBMED__BASE)
    timeout_connect: 5  # (env: CHEMBL_DA_PUBMED_TIMEOUT_CONNECT)
    timeout_read: 10  # (env: CHEMBL_DA_PUBMED_TIMEOUT_READ)
    retries: 2  # (env: CHEMBL_DA_PUBMED_RETRIES)
  semantic_scholar:
    base: "https://api.semanticscholar.org/graph/v1"  # Semantic Scholar API root (env: CHEMBL_DA__SOURCES__SEMANTIC_SCHOLAR__BASE)
    timeout_connect: 5  # (env: CHEMBL_DA_SEMANTIC_SCHOLAR_TIMEOUT_CONNECT)
    timeout_read: 10  # (env: CHEMBL_DA_SEMANTIC_SCHOLAR_TIMEOUT_READ)
    retries: 2  # (env: CHEMBL_DA_SEMANTIC_SCHOLAR_RETRIES)

local:
  resources:
    dictionary_dir: "dictionary"  # Directory with supplementary lookup tables
    iuphar_target_csv: "dictionary/_IUPHAR/_IUPHAR_target.csv"  # IUPHAR target mapping file
    iuphar_family_csv: "dictionary/_IUPHAR/_IUPHAR_family.csv"  # IUPHAR family mapping file
    uniprot_data_dir: "dictionary/uniprot"  # Directory containing cached UniProt JSON files
    organism_csv: "dictionary/_Target/targets_type.csv"  # Organism taxonomy mapping file
    targets_type_csv: "dictionary/_Target/targets_type.csv"  # Target type mapping table
  io:
    output_dir: "data/output"  # Directory for generated datasets
    cache_dir: ".cache"  # Directory for cached HTTP responses (env: CHEMBL_DA_CACHE_DIR)
    csv_sep: ","  # CSV field separator
    csv_encoding: "utf-8-sig"  # Encoding for CSV files
    exist_ok: true  # Create directories with ensure_dirs if missing
  init:
    same_doc: "data/input/ChEMBL/ChEMBL_same_document_20_05.xlsx"  # Source workbook
    all_doc: "data/input/ChEMBL/ChEMBL_all_10_05_step5.xlsx"
    output_dir: "data/output/ChEMBL/processed"  # Output directory for processed files

activity_bounds:
  enable_from_relation: true      # Derive bounds from relation/value pairs when explicit bounds are absent
  enable_from_uncertainty: false  # Parse ± expressions when available
  rounding_digits: 3              # Decimal places for lower_value/upper_value
  clamp_nonnegative: true         # Clamp negative bounds for concentration-style metrics
  log_unknown_relations: true     # Emit warnings for unrecognised relation tokens

system:
  log:
    level: "INFO"  # Default logging level (env: CHEMBL_DA_LOG_LEVEL)
    format: "[%(asctime)s] %(levelname)s %(name)s: %(message)s"  # Logging format (env: CHEMBL_DA_LOG_FORMAT)
    datefmt: "%Y-%m-%d %H:%M:%S"  # Timestamp format (env: CHEMBL_DA__SYSTEM__LOG__DATEFMT)
  rate:
    global_rps: 100  # Global requests-per-second limit
    global_burst: 100  # Global burst size
    limiter_cache_maxsize: 128  # Max cached limiters
    limiter_cache_ttl: 600  # Time-to-live for cached limiters in seconds
  retry:
    max_attempts: 3  # HTTP retry attempts (env: CHEMBL_DA_RETRY_MAX_ATTEMPTS)
    backoff_factor: 0.5  # Base delay multiplier (env: CHEMBL_DA_RETRY_BACKOFF_FACTOR)
    status_forcelist:
      - 429  # Too Many Requests
      - 500
      - 502
      - 503
      - 504
  doc_type:
    weights:
      pubmed: 4
      openalex: 3
      scholar: 2
    thresholds:
      review: 1
      experimental: 1
      unknown: 2
    limit: null
