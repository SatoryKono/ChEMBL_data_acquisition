messages:
  - role: system
    content: >-
      Ты — технический аналитик и инженер данных, специализирующийся на
      документировании ETL-пайплайнов на Python (pandas).

      Твоя задача — создавать детальные, структурированные, инженерно-точные
      описания этапов постобработки данных на уровне кода.

      Ты пишешь документацию в формате, пригодном для технических ревью,
      QA-аудита и валидации соответствия данных схемам.

      Основные принципы:


      Структурность и формальность.

      Используй жёсткую иерархию заголовков (#, ##, ###) и однотипные карточки
      стадий (S01, S02, ...).


      Точность терминов.

      Упоминай конкретные имена функций, колонок, ключей соединения, типов
      данных, и значения флагов.

      Не используй общие фразы вроде “обрабатывает данные” или “проводит
      нормализацию”.


      Прослеживаемость.

      Каждая колонка и функция должна быть связана с её происхождением и
      назначением.

      Для derived-полей указывай формулы или правила вычисления.


      Детерминизм и контроль качества.

      Отмечай механизмы, обеспечивающие воспроизводимость результата
      (фиксированный порядок колонок, сортировка, типы, кодировка).


      Инженерный стиль.

      Пиши сухо и по делу, как внутреннюю документацию для команды
      разработчиков.

      Без художественных оборотов, без “введение” и “заключение”.

      Используй Markdown-таблицы и списки там, где это повышает читаемость.
  - role: user
    content: >-
      Репозиторий: {{SatoryKono/ChEMBL_data_acquisition}}

      Роль исполнителя: разработчик ETL/документации (Python + pandas)

      Цель: подготовить детальное, проверяемое и воспроизводимое описание всех
      стадий постобработки данных в get_activity_data.py.


      1) Область охвата


      Разобрать полный пайплайн постобработки таблицы activity после этапов
      извлечения/сырых загрузок.


      Включить все функции и блоки, влияющие на: фильтрацию, нормализацию,
      объединение, обогащение, валидацию, сортировку и сериализацию.


      2) Единый формат описания каждой стадии


      Для каждой стадии постобработки привести карточку по шаблону:


      Идентификатор стадии: SXX_name


      Функция/блок: (например) _normalize_columns, _merge_reference_tables,
      _compute_flags


      Назначение: какую задачу решает и какие ошибки предотвращает

      (примеры: устранение дублей по activity_id; присвоение pipeline_version;
      формирование QC-флагов; фиксация типов)


      Вход: структура DataFrame (полное перечисление колонок с типами: col:
      dtype), ограничения и инварианты


      Выход: структура DataFrame (все добавленные/удаленные/переименованные
      колонки, их типы, ожидаемые домены значений)


      Операция: один или несколько подпунктов, каждый с обязательным указанием:


      тип операции: filter | normalize | join/merge | groupby/aggregate | derive
      | sort | serialize


      список затронутых колонок,


      точные критерии/параметры (например: filter invalid.document in {'Y'};
      str.strip(), str.lower(); merge on
      ['assay_chembl_id','molecule_chembl_id'] how='left'),


      правила приведения типов (astype('Int64'),
      CategoricalDtype(categories=[...], ordered=True)),


      обработка пропусков/аномалий (fillna, clip, validate),


      ожидаемый эффект (число строк/уникальных ключей до/после, инварианты).


      Зависимости: какие словари/схемы/утилиты используются.


      Псевдокод: краткий блок с пошаговой логикой (3–10 строк).


      Критерии успешности стадии: проверяемые утверждения (assertions) и/или
      правила валидации.


      3) Требования к содержанию

      3.1 Полный порядок трансформаций


      Дать нумерованный pipeline от сырого activity до финального фрейма перед
      сериализацией.


      Указать контрольные точки: после каждой крупной стадии — размер таблицы,
      кардинальность ключей (activity_id, (assay_chembl_id, molecule_chembl_id)
      и др.), количество NaN в критичных полях.


      3.2 Фильтрации


      Перечислить все фильтры с конкретными значениями флагов и исходами:


      пример: invalid.document in {'Y'} → строка удаляется; completed == True →
      строка сохраняется; duplicate_of.notnull() → дубликат снимается.


      Явно описать правила по дублям: ключи дедупликации, сортировка при выборе
      представителя (например, по timestamp_utc, review desc, high_citation_rate
      desc), что происходит при полной эквивалентности.


      3.3 Нормализации


      Текст: strip, lower, Unicode NFC/NFKC, удаление невидимых символов,
      унификация пробелов.


      Категории: список разрешенных значений по колонкам и стратегия для
      out-of-vocabulary.


      Числа/единицы: правила приведения standard_units, округление
      standard_value, вычисление pchembl_value и пограничные случаи.


      3.4 Объединения и агрегирования


      Для каждого merge/join:


      источники данных (какой файл/таблица/словарь), ключи соединения, how,
      ожидаемая кардинальность,


      список притягиваемых колонок и их типы,


      политика конфликтов и префиксы имен при коллизиях,


      контроль потерь строк/мультипликативных дубликатов.


      Для groupby/aggregate:


      ключи группировки, агрегаты, политика для NaN и многозначности.


      3.5 Производные колонки (derived)


      Полный список вычисляемых колонок: флаги, индексы, классификации, хэши,
      pipeline_version, timestamp_utc.


      Для каждой — формула/логика, используемые поля, домен значений, тип,
      инварианты и негативные примеры.


      3.6 Сортировка и сериализация


      Чёткий алгоритм сортировки с приоритетами колонок и порядком.


      Фиксированный порядок колонок в финальном выводе.


      Сериализация: формат(ы) (to_csv, to_parquet), кодировка, na_rep,
      float_format, локаль, контроль CRLF/UTF-8-BOM, детерминизм
      (PYTHONHASHSEED=0).


      4) Использование словарей и схем


      Словари из config/dictionary/: перечислить задействованные файлы и точно
      указать какие колонки из них читаются и куда мапятся.

      Пример таблицы:


      | Словарь                          | Ключи
      соединения                         | Тянем
      колонки                             | Назначение                         |

      |----------------------------------|------------------------------------------|-------------------------------------------|------------------------------------|

      | _Target/targets_type.csv         |
      target_chembl_id                         | IUPHAR_type,
      unicellular_organism, ...    | Классификация целей                |

      | _Document/document_qc.csv        |
      document_chembl_id                       | completed, review,
      invalid.document        | QC-флаги документов                |



      Схемы из schemas/: указать файл схемы, правила приведения типов,
      обязательные/опциональные поля, валидационные проверки и реакцию на
      несоответствие (fail-fast vs soft-warn).


      5) Интеграция с библиотекой


      Задействованные утилиты: library/postprocessing/*, library/utils/* —
      перечислить функции, их контракт и побочные эффекты (логирование, кэш,
      I/O).


      Указать, где задаются pipeline_version и timestamp_utc, и кто за них
      отвечает.


      6) Требования к качеству и детерминизму


      Идемпотентность: повторный запуск при одинаковых входах дает идентичный
      вывод (байтово одинаковый CSV/Parquet).


      Контроль времени/локали: timestamp_utc в UTC, не зависит от TZ процесса.


      Явные проверки: отсутствие дубликатов ключей, отсутствие неожиданных
      категорий, стабильная сортировка, фиксированные типы.


      7) Формат результата


      Создать файл: docs/postprocessing_activity_{YYYYMMDD}.md со структурой:


      # Постобработка activity

      ## 1. Обзор и диаграмма пайплайна (Mermaid/Graphviz)

      ## 2. Контрольные точки (размеры, кардинальности, NaN)

      ## 3. Стадии S01..SNN (карточки стадий по шаблону)

      ## 4. Используемые словари и схемы (таблицы)

      ## 5. Инварианты и проверки (чек-лист)

      ## 6. Известные углы и риски (с примерами входов/выходов)

      ## 7. Приложения: таблицы колонок (имя, тип, домен, описание)



      Дополнительно приложить CSV/MD-таблицу:


      docs/tables/activity_columns_{YYYYMMDD}.csv

      # name,type,nullable,domain,source_stage,description


      8) Критерии приемки


      Полнота: описаны все стадии, все фильтры, все merge/join/groupby, все
      derived-колонки, сортировка, сериализация.


      Проверяемость: для каждой стадии есть чёткие критерии успеха и инварианты.


      Воспроизводимость: указаны типы, домены, порядок колонок, кодировки, чтобы
      получить детерминированный артефакт.


      Трассируемость: для каждой колонки финального вывода указана стадия
      появления/изменения.
model: openai/gpt-4o
